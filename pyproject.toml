[project]
name = "traderbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.20", "statsmodels>=0.14", "pandas-market-calendars>=4.3",
  "pandas>=2.0", "numpy>=1.26", "scipy>=1.11", "pydantic>=2.5",
  "aiosqlite>=0.19", "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "hypothesis>=6.100"]

[project.scripts]
traderbot = "traderbot.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
